# Enhanced Google Cloud Build configuration for AgentMeter
# This file defines the build and deployment pipeline with commercial account features

steps:
  # Install dependencies and build the service
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']
    
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build:service']

  # Build and push service container to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-service:${_ENVIRONMENT}-${BUILD_ID}'
      - '-f'
      - 'deployment/dockerfiles/Dockerfile.service'
      - '--build-arg'
      - 'COMMIT_SHA=${_COMMIT_SHA}'
      - '--build-arg'
      - 'BUILD_TIME=${_BUILD_TIME}'
      - '--build-arg'
      - 'ENVIRONMENT=${_ENVIRONMENT}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-service:${_ENVIRONMENT}-${BUILD_ID}'

  # Deploy service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentmeter-service'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-service:${_ENVIRONMENT}-${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '100'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080,ENVIRONMENT=${_ENVIRONMENT}'
      - '--set-secrets'
      - 'SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-key:latest'
      - '--labels'
      - 'environment=${_ENVIRONMENT},component=service,commit=${_COMMIT_SHA}'

  # Build and push frontend container to Artifact Registry
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-frontend:${_ENVIRONMENT}-${BUILD_ID}'
      - '-f'
      - 'deployment/dockerfiles/Dockerfile.frontend'
      - '--build-arg'
      - 'COMMIT_SHA=${_COMMIT_SHA}'
      - '--build-arg'
      - 'BUILD_TIME=${_BUILD_TIME}'
      - '--build-arg'
      - 'ENVIRONMENT=${_ENVIRONMENT}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-frontend:${_ENVIRONMENT}-${BUILD_ID}'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'agentmeter-frontend'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-frontend:${_ENVIRONMENT}-${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '50'
      - '--timeout'
      - '60s'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080,ENVIRONMENT=${_ENVIRONMENT}'
      - '--labels'
      - 'environment=${_ENVIRONMENT},component=frontend,commit=${_COMMIT_SHA}'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY

# Default substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _ENVIRONMENT: 'production'
  _COMMIT_SHA: 'unknown'
  _BUILD_TIME: 'unknown'

# Images to be pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-service:${_ENVIRONMENT}-${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/agentmeter-repo/agentmeter-frontend:${_ENVIRONMENT}-${BUILD_ID}'

# Build timeout
timeout: '1200s'

# Artifacts to store
artifacts:
  objects:
    location: 'gs://$PROJECT_ID-build-artifacts'
    paths:
      - 'static/service.js'
      - 'static/app.js'
      - 'package.json' 